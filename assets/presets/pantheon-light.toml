preset = "PantheonLight"
theme_mode = "Light"
accent = "Iris"
surface_material = "Frosted"
hide_native_taskbar = true

[top_bar]
style = "FullWidth"
height = 34
show_seconds = false

[dock]
enabled = true
icon_size = 48
magnification_scale = 1.42
max_magnify_radius = 136.0
show_space_chip = false
show_resume_chip = false
auto_hide = false

[[dock.pinned_apps]]
name = "Files"
target = "explorer.exe"
exe_name = "explorer.exe"

[[dock.pinned_apps]]
name = "Edge"
target = "msedge.exe"
exe_name = "msedge.exe"

[[dock.pinned_apps]]
name = "Terminal"
target = "wt.exe"
exe_name = "WindowsTerminal.exe"

[[dock.pinned_apps]]
name = "Notepad"
target = "notepad.exe"
exe_name = "notepad.exe"

[[dock.pinned_apps]]
name = "Settings"
target = "ms-settings:"
exe_name = "SystemSettings.exe"

[accessibility]
reduce_motion = false
increase_contrast = false




